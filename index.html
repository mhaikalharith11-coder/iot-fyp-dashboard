<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IoT-FYP Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#0b1220;
    color:#e8eef7;
    min-height:100vh;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:28px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:28px;
}

.title{
    font-size:28px;
    font-weight:700;
}

.subtitle{
    color:#91a0b7;
    margin-top:6px;
}

.live{
    padding:8px 13px;
    border-radius:20px;
    background:#123522;
    color:#58e08a;
    font-size:13px;
    font-weight:600;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:20px;
}

.card,
.chart-card{
    background:#121c2d;
    border:1px solid #243249;
    border-radius:16px;
    padding:22px;
}

.label{
    color:#91a0b7;
    font-size:13px;
    margin-bottom:12px;
}

.value{
    font-size:32px;
    font-weight:700;
}

.unit{
    font-size:15px;
    color:#91a0b7;
    margin-left:5px;
}

.status{
    margin-top:10px;
    font-size:13px;
    font-weight:600;
}

.normal{
    color:#58e08a;
}

.warning{
    color:#ffcc66;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.chart-title{
    font-size:16px;
    font-weight:600;
    margin-bottom:18px;
}

.chart-wrap{
    height:280px;
}

.footer{
    margin-top:20px;
    color:#687991;
    font-size:12px;
    text-align:center;
}

@media(max-width:850px){
    .cards{
        grid-template-columns:repeat(2,1fr);
    }

    .grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:520px){
    .container{
        padding:18px;
    }

    .cards{
        grid-template-columns:1fr;
    }

    .value{
        font-size:28px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div>
            <div class="title">
                IoT-FYP Dashboard
            </div>

            <div class="subtitle">
                In-Pipe Energy Monitoring System
            </div>
        </div>

        <div class="live">
            ● LIVE DATA
        </div>

    </div>


    <div class="cards">

        <div class="card">

            <div class="label">
                VOLTAGE
            </div>

            <div>
                <span id="voltage" class="value">--</span>
                <span class="unit">V</span>
            </div>

            <div id="voltageStatus" class="status">
                Waiting...
            </div>

        </div>


        <div class="card">

            <div class="label">
                RAIN
            </div>

            <div>
                <span id="rain" class="value">--</span>
            </div>

            <div id="rainStatus" class="status">
                Waiting...
            </div>

        </div>


        <div class="card">

            <div class="label">
                LAST READING
            </div>

            <div id="lastReading"
                 class="value"
                 style="font-size:19px">
                --
            </div>

            <div class="status">
                Malaysia Time (GMT+8)
            </div>

        </div>


        <div class="card">

            <div class="label">
                RECORDS
            </div>

            <div id="records"
                 class="value">
                --
            </div>

            <div class="status normal">
                Database connected
            </div>

        </div>

    </div>


    <div class="grid">

        <div class="chart-card">

            <div class="chart-title">
                Voltage History
            </div>

            <div class="chart-wrap">
                <canvas id="voltageChart"></canvas>
            </div>

        </div>


        <div class="chart-card">

            <div class="chart-title">
                Rain History
            </div>

            <div class="chart-wrap">
                <canvas id="rainChart"></canvas>
            </div>

        </div>

    </div>


    <div class="footer">
        IoT-FYP • Supabase Data API • Malaysia Time (GMT+8) • Auto refresh every 5 seconds
    </div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://yemublzamyvyheheqoij.supabase.co";

const SUPABASE_KEY =
"sb_publishable_V72oPOCmQdC2DPke7OwPng_3DaQUy9y";

const ENDPOINT =
`${SUPABASE_URL}/rest/v1/sensor_data`;


/* =========================================
   MALAYSIA TIMEZONE
========================================= */

const MALAYSIA_TIMEZONE =
"Asia/Kuala_Lumpur";


/* =========================================
   CHART VARIABLES
========================================= */

let voltageChart;
let rainChart;


/* =========================================
   CHART OPTIONS
========================================= */

const options = {

    responsive:true,

    maintainAspectRatio:false,

    plugins:{
        legend:{
            display:false
        }
    },

    scales:{

        x:{
            ticks:{
                color:"#91a0b7"
            },

            grid:{
                color:"#243249"
            }
        },

        y:{
            ticks:{
                color:"#91a0b7"
            },

            grid:{
                color:"#243249"
            }
        }

    }

};


/* =========================================
   CONVERT SUPABASE TIME TO MALAYSIA TIME
========================================= */

function convertToMalaysiaTime(dateString){

    let value = String(dateString);

    /*
       Supabase timestamp may arrive without
       timezone information.

       We force it to UTC first.
    */

    if(
        !value.endsWith("Z") &&
        !value.includes("+") &&
        !/[+-]\d{2}:\d{2}$/.test(value)
    ){

        value =
            value.replace(" ","T") + "Z";

    }


    return new Date(value);

}


/* =========================================
   FORMAT DATE + TIME
========================================= */

function formatMalaysiaDateTime(dateString){

    const date =
        convertToMalaysiaTime(dateString);


    return date.toLocaleString(
        "en-MY",
        {

            timeZone:MALAYSIA_TIMEZONE,

            year:"numeric",

            month:"2-digit",

            day:"2-digit",

            hour:"2-digit",

            minute:"2-digit",

            second:"2-digit",

            hour12:true

        }
    );

}


/* =========================================
   FORMAT GRAPH TIME
========================================= */

function formatMalaysiaTime(dateString){

    const date =
        convertToMalaysiaTime(dateString);


    return date.toLocaleTimeString(
        "en-MY",
        {

            timeZone:MALAYSIA_TIMEZONE,

            hour:"2-digit",

            minute:"2-digit",

            second:"2-digit",

            hour12:true

        }
    );

}


/* =========================================
   CREATE VOLTAGE + RAIN CHART
========================================= */

function makeCharts(){

    voltageChart =
        new Chart(
            document.getElementById("voltageChart"),
            {

                type:"line",

                data:{

                    labels:[],

                    datasets:[

                        {

                            data:[],

                            tension:0.35,

                            fill:false

                        }

                    ]

                },

                options:options

            }
        );


    rainChart =
        new Chart(
            document.getElementById("rainChart"),
            {

                type:"line",

                data:{

                    labels:[],

                    datasets:[

                        {

                            data:[],

                            tension:0.35,

                            fill:false

                        }

                    ]

                },

                options:options

            }
        );

}


/* =========================================
   LOAD DATA FROM SUPABASE
========================================= */

async function loadData(){

    try{

        const response =
            await fetch(

                `${ENDPOINT}?select=id,voltage,rain,voltage_status,rain_status,reading_time&order=reading_time.desc&limit=20`,

                {

                    headers:{

                        "apikey":
                        SUPABASE_KEY,

                        "Authorization":
                        `Bearer ${SUPABASE_KEY}`

                    }

                }

            );


        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }


        const rows =
            await response.json();


        if(!rows.length){

            return;

        }


        /* =================================
           LATEST DATA
        ================================= */

        const latest =
            rows[0];


        /* Voltage */

        document.getElementById(
            "voltage"
        ).textContent =
            latest.voltage ?? "--";


        /* Rain */

        document.getElementById(
            "rain"
        ).textContent =
            latest.rain ?? "--";


        /* Voltage Status */

        document.getElementById(
            "voltageStatus"
        ).textContent =
            latest.voltage_status ?? "--";


        /* Rain Status */

        document.getElementById(
            "rainStatus"
        ).textContent =
            latest.rain_status ?? "--";


        /* =================================
           LAST READING
           MALAYSIA UTC+8
        ================================= */

        document.getElementById(
            "lastReading"
        ).textContent =
            formatMalaysiaDateTime(
                latest.reading_time
            );


        /* =================================
           RECORDS
        ================================= */

        document.getElementById(
            "records"
        ).textContent =
            rows.length +
            (rows.length === 20 ? "+" : "");


        /* =================================
           CHART DATA
        ================================= */

        const chartData =
            [...rows].reverse();


        /* =================================
           MALAYSIA TIME LABELS
        ================================= */

        const labels =
            chartData.map(

                row =>
                    formatMalaysiaTime(
                        row.reading_time
                    )

            );


        /* =================================
           VOLTAGE CHART
        ================================= */

        voltageChart.data.labels =
            labels;


        voltageChart.data.datasets[0].data =
            chartData.map(

                row =>
                    Number(row.voltage)

            );


        voltageChart.update();


        /* =================================
           RAIN CHART
        ================================= */

        rainChart.data.labels =
            labels;


        rainChart.data.datasets[0].data =
            chartData.map(

                row =>
                    Number(row.rain)

            );


        rainChart.update();


        /* =================================
           LIVE STATUS
        ================================= */

        document.querySelector(
            ".live"
        ).textContent =
            "● LIVE DATA";

    }


    catch(error){

        console.error(error);


        document.querySelector(
            ".live"
        ).textContent =
            "● CONNECTION ERROR";

    }

}


/* =========================================
   START
========================================= */

makeCharts();

loadData();


/* =========================================
   AUTO REFRESH EVERY 5 SECONDS
========================================= */

setInterval(
    loadData,
    5000
);

</script>

</body>
</html>
