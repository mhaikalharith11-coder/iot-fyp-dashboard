<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IoT-FYP Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #08111f;
            color: white;
            min-height: 100vh;
        }

        .container {
            width: 82%;
            max-width: 1450px;
            margin: auto;
            padding: 35px 0;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .title h1 {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .title p {
            font-size: 21px;
            color: #9bb5d3;
        }

        .live {
            background: #0d3b27;
            color: #42f58d;
            padding: 11px 20px;
            border-radius: 25px;
            font-weight: bold;
        }

        /* CARDS */
        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px;
            margin-bottom: 25px;
        }

        .card {
            background: #111d2e;
            border: 1px solid #263953;
            border-radius: 18px;
            padding: 28px;
            min-height: 165px;
        }

        .card-title {
            color: #9bb5d3;
            font-size: 17px;
            margin-bottom: 15px;
        }

        .value {
            font-size: 39px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .unit {
            font-size: 18px;
            color: #8ca8c8;
            font-weight: normal;
        }

        .status {
            font-weight: bold;
            font-size: 16px;
        }

        .normal {
            color: white;
        }

        .connected {
            color: #42f58d;
        }

        .last-reading {
            font-size: 20px;
            font-weight: bold;
            white-space: nowrap;
        }

        .timezone {
            margin-top: 12px;
            font-size: 15px;
            font-weight: bold;
        }

        /* CHARTS */
        .charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .chart-card {
            background: #111d2e;
            border: 1px solid #263953;
            border-radius: 18px;
            padding: 26px;
            height: 450px;
        }

        .chart-card h2 {
            font-size: 20px;
            margin-bottom: 20px;
        }

        .chart-container {
            position: relative;
            height: 370px;
        }

        /* MOBILE */
        @media (max-width: 900px) {

            .container {
                width: 92%;
            }

            .cards {
                grid-template-columns: 1fr 1fr;
            }

            .charts {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .title h1 {
                font-size: 28px;
            }

            .title p {
                font-size: 17px;
            }

            .last-reading {
                white-space: normal;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">

        <div class="title">
            <h1>IoT-FYP Dashboard</h1>
            <p>In-Pipe Energy Monitoring System</p>
        </div>

        <div class="live">
            ● LIVE DATA
        </div>

    </div>


    <!-- CARDS -->
    <div class="cards">

        <!-- VOLTAGE -->
        <div class="card">

            <div class="card-title">
                VOLTAGE
            </div>

            <div class="value">
                <span id="voltageValue">--</span>
                <span class="unit">V</span>
            </div>

            <div id="voltageStatus" class="status normal">
                --
            </div>

        </div>


        <!-- RAIN -->
        <div class="card">

            <div class="card-title">
                RAIN
            </div>

            <div class="value">
                <span id="rainValue">--</span>
            </div>

            <div id="rainStatus" class="status normal">
                --
            </div>

        </div>


        <!-- LAST READING -->
        <div class="card">

            <div class="card-title">
                LAST READING
            </div>

            <div id="lastReading" class="last-reading">
                --
            </div>

            <div class="timezone">
                Malaysia Time (GMT+8)
            </div>

        </div>


        <!-- RECORDS -->
        <div class="card">

            <div class="card-title">
                RECORDS
            </div>

            <div class="value">
                <span id="recordCount">--</span>
            </div>

            <div id="databaseStatus" class="status connected">
                Database connected
            </div>

        </div>

    </div>


    <!-- CHARTS -->
    <div class="charts">

        <!-- VOLTAGE CHART -->
        <div class="chart-card">

            <h2>
                Voltage History
            </h2>

            <div class="chart-container">
                <canvas id="voltageChart"></canvas>
            </div>

        </div>


        <!-- RAIN CHART -->
        <div class="chart-card">

            <h2>
                Rain History
            </h2>

            <div class="chart-container">
                <canvas id="rainChart"></canvas>
            </div>

        </div>

    </div>

</div>


<script>

    /* =====================================================
       SUPABASE
       ===================================================== */

    const SUPABASE_URL =
        "https://yemublzamyvyheheqoij.supabase.co";

    /*
       MASUKKAN PUBLISHABLE KEY AWAK DI SINI.
       Guna key yang sama seperti code lama.
    */
    const SUPABASE_KEY =
        "PASTE_YOUR_EXISTING_PUBLISHABLE_KEY_HERE";

    const ENDPOINT =
        `${SUPABASE_URL}/rest/v1/sensor_data`;


    /* =====================================================
       MALAYSIA TIME
       ===================================================== */

    function convertToMalaysiaTime(dateString) {

        let value = String(dateString).trim();

        /*
           Kalau timestamp daripada database
           tidak mempunyai timezone, kita anggap UTC.
        */

        if (
            !value.endsWith("Z") &&
            !value.includes("+") &&
            !/[+-]\d{2}:\d{2}$/.test(value)
        ) {

            value = value.replace(" ", "T") + "Z";

        }

        const utcDate = new Date(value);

        /*
           Malaysia = UTC + 8 jam
        */

        return new Date(
            utcDate.getTime() +
            (8 * 60 * 60 * 1000)
        );
    }


    function formatMalaysiaDateTime(dateString) {

        const date =
            convertToMalaysiaTime(dateString);

        return date.toLocaleString("en-MY", {

            timeZone: "UTC",

            day: "2-digit",
            month: "2-digit",
            year: "numeric",

            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",

            hour12: true

        });
    }


    function formatMalaysiaTime(dateString) {

        const date =
            convertToMalaysiaTime(dateString);

        return date.toLocaleTimeString("en-MY", {

            timeZone: "UTC",

            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",

            hour12: true

        });
    }


    /* =====================================================
       CHART VARIABLES
       ===================================================== */

    let voltageChart;
    let rainChart;


    /* =====================================================
       LOAD DATA FROM SUPABASE
       ===================================================== */

    async function loadData() {

        try {

            const response = await fetch(

                `${ENDPOINT}?select=id,voltage,rain,voltage_status,rain_status,reading_time&order=reading_time.desc&limit=20`,

                {

                    method: "GET",

                    headers: {

                        "apikey": SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${SUPABASE_KEY}`

                    }

                }

            );


            if (!response.ok) {

                throw new Error(
                    `HTTP Error: ${response.status}`
                );

            }


            const data =
                await response.json();


            if (!Array.isArray(data) ||
                data.length === 0) {

                console.log("No data found.");

                return;

            }


            /* =================================================
               LATEST DATA
               ================================================= */

            const latest = data[0];


            document.getElementById(
                "voltageValue"
            ).textContent =
                Number(latest.voltage).toFixed(1);


            document.getElementById(
                "rainValue"
            ).textContent =
                latest.rain;


            document.getElementById(
                "voltageStatus"
            ).textContent =
                latest.voltage_status;


            document.getElementById(
                "rainStatus"
            ).textContent =
                latest.rain_status;


            document.getElementById(
                "lastReading"
            ).textContent =
                formatMalaysiaDateTime(
                    latest.reading_time
                );


            document.getElementById(
                "recordCount"
            ).textContent =
                data.length;


            document.getElementById(
                "databaseStatus"
            ).textContent =
                "Database connected";


            /* =================================================
               CHART DATA
               ================================================= */

            /*
               Supabase returns newest first.
               Reverse it so chart goes oldest → newest.
            */

            const chartData =
                [...data].reverse();


            const labels =
                chartData.map(row =>
                    formatMalaysiaTime(
                        row.reading_time
                    )
                );


            const voltageValues =
                chartData.map(row =>
                    Number(row.voltage)
                );


            const rainValues =
                chartData.map(row =>
                    Number(row.rain)
                );


            /* =================================================
               UPDATE VOLTAGE CHART
               ================================================= */

            if (voltageChart) {

                voltageChart.destroy();

            }


            const voltageCtx =
                document
                    .getElementById("voltageChart")
                    .getContext("2d");


            voltageChart =
                new Chart(
                    voltageCtx,
                    {

                        type: "line",

                        data: {

                            labels: labels,

                            datasets: [

                                {

                                    label: "Voltage (V)",

                                    data:
                                        voltageValues,

                                    borderColor:
                                        "#3498db",

                                    backgroundColor:
                                        "rgba(52, 152, 219, 0.15)",

                                    borderWidth: 3,

                                    pointRadius: 4,

                                    pointHoverRadius: 6,

                                    tension: 0.3,

                                    fill: false

                                }

                            ]

                        },


                        options: {

                            responsive: true,

                            maintainAspectRatio: false,

                            plugins: {

                                legend: {

                                    display: false

                                }

                            },


                            scales: {

                                x: {

                                    ticks: {

                                        color: "#8fa3bd",

                                        maxRotation: 45,

                                        minRotation: 45

                                    },

                                    grid: {

                                        color:
                                            "#263953"

                                    }

                                },


                                y: {

                                    ticks: {

                                        color: "#8fa3bd"

                                    },

                                    grid: {

                                        color:
                                            "#263953"

                                    }

                                }

                            }

                        }

                    }
                );


            /* =================================================
               UPDATE RAIN CHART
               ================================================= */

            if (rainChart) {

                rainChart.destroy();

            }


            const rainCtx =
                document
                    .getElementById("rainChart")
                    .getContext("2d");


            rainChart =
                new Chart(
                    rainCtx,
                    {

                        type: "line",

                        data: {

                            labels: labels,

                            datasets: [

                                {

                                    label: "Rain",

                                    data:
                                        rainValues,

                                    borderColor:
                                        "#3498db",

                                    backgroundColor:
                                        "rgba(52, 152, 219, 0.15)",

                                    borderWidth: 3,

                                    pointRadius: 4,

                                    pointHoverRadius: 6,

                                    tension: 0.3,

                                    fill: false

                                }

                            ]

                        },


                        options: {

                            responsive: true,

                            maintainAspectRatio: false,

                            plugins: {

                                legend: {

                                    display: false

                                }

                            },


                            scales: {

                                x: {

                                    ticks: {

                                        color: "#8fa3bd",

                                        maxRotation: 45,

                                        minRotation: 45

                                    },

                                    grid: {

                                        color:
                                            "#263953"

                                    }

                                },


                                y: {

                                    ticks: {

                                        color: "#8fa3bd"

                                    },

                                    grid: {

                                        color:
                                            "#263953"

                                    }

                                }

                            }

                        }

                    }
                );


        }

        catch (error) {

            console.error(
                "Supabase error:",
                error
            );


            document.getElementById(
                "databaseStatus"
            ).textContent =
                "Database connection error";

        }

    }


    /* =====================================================
       FIRST LOAD
       ===================================================== */

    loadData();


    /* =====================================================
       AUTO REFRESH EVERY 5 SECONDS
       ===================================================== */

    setInterval(
        loadData,
        5000
    );

</script>

</body>
</html>
